name: Deploy Oracle
run-name: Deploy Oracle · ${{ github.event.workflow_run.head_sha || inputs.sha || 'latest green main' }}

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Optional certified 40-character SHA; blank uses the latest green main CI
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oracle-deployment
  cancel-in-progress: false

jobs:
  resolve-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      run_id: ${{ steps.release.outputs.run_id }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a certified main commit and retained artifact
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          sha="${REQUESTED_SHA,,}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            sha="${TRIGGER_SHA,,}"
          fi
          if [[ -z "$sha" ]]; then
            sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::No green main CI commit was found. Select a full SHA explicitly."
            exit 1
          fi
          git fetch --quiet origin main
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$sha" != "$(git rev-parse origin/main)" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded CI commit $sha; a newer main push owns automatic deployment."
            exit 0
          fi
          git cat-file -e "${sha}^{commit}"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::The selected commit is not on main."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            run_id="$TRIGGER_RUN_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
              jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" \
                '.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo' >/dev/null
          else
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --limit 100 --json databaseId,headSha,headBranch,conclusion,event)"
            run_id="$(jq -r --arg sha "$sha" '[.[] | select(.headSha == $sha and .headBranch == "main" and .event == "push" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<< "$runs")"
          fi
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run exists for $sha."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "radar-release-$sha"; then
            echo "::error::The certified release artifact for $sha is missing or expired."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Selected certified main commit: $sha (CI run $run_id)"

  deploy:
    needs: resolve-release
    if: needs.resolve-release.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Oracle
    env:
      GH_TOKEN: ${{ github.token }}
      RADAR_ENV: production
      RADAR_DEPLOY_SSH_HOST: ${{ vars.RADAR_DEPLOY_SSH_HOST }}
      RADAR_DEPLOY_SSH_USER: ${{ vars.RADAR_DEPLOY_SSH_USER }}
      RADAR_DEPLOY_APP_DIRECTORY: ${{ vars.RADAR_DEPLOY_APP_DIRECTORY }}
      RADAR_DEPLOY_DB_FINGERPRINT: ${{ vars.RADAR_DEPLOY_DB_FINGERPRINT }}
      RADAR_DEPLOY_READINESS_URL: ${{ vars.RADAR_DEPLOY_READINESS_URL }}
      RADAR_DEPLOYMENT_MODE: ${{ vars.RADAR_DEPLOYMENT_MODE }}
      RADAR_SERVER_SCRAPER_ENABLED: ${{ vars.RADAR_SERVER_SCRAPER_ENABLED }}
      TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
      RADAR_DEPLOY_RECOVERY_COMMAND: ${{ secrets.RADAR_DEPLOY_RECOVERY_COMMAND }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Check deployment configuration and host runtime
        shell: bash
        run: |
          set -euo pipefail
          for name in RADAR_DEPLOY_SSH_HOST RADAR_DEPLOY_SSH_USER RADAR_DEPLOY_APP_DIRECTORY RADAR_DEPLOY_DB_FINGERPRINT RADAR_DEPLOY_READINESS_URL RADAR_DEPLOYMENT_MODE TURSO_CONNECTION_URL RADAR_DEPLOY_RECOVERY_COMMAND ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Oracle environment setting $name is missing."
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/oracle-ssh-key"
          chmod 600 "$RUNNER_TEMP/oracle-ssh-key"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "RADAR_DEPLOY_SSH_KEY_PATH=$RUNNER_TEMP/oracle-ssh-key" >> "$GITHUB_ENV"

          remote_platform="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/oracle-ssh-key" "$RADAR_DEPLOY_SSH_USER@$RADAR_DEPLOY_SSH_HOST" 'uname -s -m')"
          remote_node="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$RUNNER_TEMP/oracle-ssh-key" "$RADAR_DEPLOY_SSH_USER@$RADAR_DEPLOY_SSH_HOST" 'node --version')"
          if [[ "$remote_platform" != "Linux x86_64" || ! "$remote_node" =~ ^v22\. ]]; then
            echo "::error::Oracle runtime $remote_platform / $remote_node does not match the Linux x64 / Node 22 CI artifact."
            exit 1
          fi

      - name: Download the exact certified release
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
          CI_RUN_ID: ${{ needs.resolve-release.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radar-release" "$RUNNER_TEMP/radar-runtime"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "radar-release-$RELEASE_SHA" --dir "$RUNNER_TEMP/radar-release"
          artifact="$RUNNER_TEMP/radar-release/radar-release-$RELEASE_SHA.tar.gz"
          test -s "$artifact"
          tar -xzf "$artifact" -C "$RUNNER_TEMP/radar-runtime"
          test -x "$RUNNER_TEMP/radar-runtime/node_modules/.bin/tsx"
          echo "RADAR_DEPLOY_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Deploy and verify Oracle release
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          set -euo pipefail
          # Recheck after the concurrency wait/download: never roll back a newer
          # main commit just because an older CI completion arrived late.
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$RELEASE_SHA" != "$main_sha" ]]; then
              echo "Skipping superseded automatic release $RELEASE_SHA."
              echo "Automatic deployment skipped: a newer main push superseded $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          cd "$RUNNER_TEMP/radar-runtime"
          node_modules/.bin/tsx scripts/deploy.ts "$RELEASE_SHA"
          echo "Oracle is serving certified release $RELEASE_SHA."
          {
            echo "### Oracle deployment"
            echo "- Commit: $RELEASE_SHA"
            echo "- Target: $RADAR_DEPLOY_SSH_HOST"
            echo "- Database fingerprint: $RADAR_DEPLOY_DB_FINGERPRINT"
            echo "- Readiness: $RADAR_DEPLOY_READINESS_URL/health/system"
          } >> "$GITHUB_STEP_SUMMARY"
