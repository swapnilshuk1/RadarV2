name: Weekly test estate
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-estate
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm install -g npm@10.9.9
      - run: npm ci
      - name: Inventory drift
        run: npm run tests:inventory:check
      - name: Full estate including regression lane
        run: npm run test:full
        env:
          RADAR_ENV: test
      # No provider credentials, packaging, deployment or production database.
