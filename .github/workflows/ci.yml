name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc -p tsconfig.verify.json --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Certification Test Manifest
        run: npx vitest run --config vitest.certification.config.ts
