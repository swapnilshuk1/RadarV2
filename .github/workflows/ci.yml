name: CI

on:
  push:
    branches: [main, "rebuild/**", "readiness/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked machine state and generated artifacts
        shell: bash
        run: |
          set -euo pipefail

          forbidden_dirs=(
            audit
            audit-reports
            forensics
            output
            playwright-profile
            radar-certification
            sample
            scraper-profile
          )

          failed=0
          for dir in "${forbidden_dirs[@]}"; do
            if git ls-files "${dir}/**" | grep -q .; then
              echo "::error::Tracked repository artifact directory: ${dir}/"
              failed=1
            fi
          done

          forbidden_files="$(
            git ls-files |
              grep -E '(^|/)(auth|auth-wal|auth-shm)$|\.(sqlite|sqlite-shm|sqlite-wal|db|db-wal|db-shm|mhtml|docx)$|(^|/).*_dump\..*$|(^|/).*api_hit.*\.json$|(^|/)(search_page_dump\.html|single_card\.html|next_data\.json)$|^(test\.js|test.*\.cjs|temp\.js|parser\.cjs|scripts-and-tests-inventory\.json|radar-challenge-corpus\.json)$' ||
              true
          )"

          if [ -n "$forbidden_files" ]; then
            echo "::error::Forbidden tracked artifacts:"
            echo "$forbidden_files"
            failed=1
          fi

          exit "$failed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@10.9.9

      - name: Install dependencies
        run: npm ci

      - name: Run authoritative release certification
        # The scraper preflight test launches a real offline Chromium instance.
        # Browser availability is a prerequisite, not a mocked success.
        run: |
          npx playwright install --with-deps chromium
          npm run certify

      - name: Package exact certified release artifact
        run: npm run release:package

      - name: Verify extracted release portability
        shell: bash
        run: |
          set -euo pipefail

          SHA="${GITHUB_SHA}"
          ARTIFACT="release/radar-release-${SHA}.tar.gz"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "${CHECK_DIR}"' EXIT

          tar -xzf "${ARTIFACT}" -C "${CHECK_DIR}"
          cd "${CHECK_DIR}"

          test -f tsconfig.json
          test -f config/ontologies/technology.json
          test -f config/ontologies/technology.meta.json

          ABS_LINK="$(find . -type l -lname '/*' -print -quit)"
          if [ -n "${ABS_LINK}" ]; then
            echo "::error::Release contains absolute symlink: ${ABS_LINK} -> $(readlink "${ABS_LINK}")"
            exit 1
          fi

          node_modules/.bin/tsx --version
          node_modules/.bin/tsx scripts/release/verify.ts . "${SHA}"
          node_modules/.bin/tsx --tsconfig tsconfig.json scripts/release/smoke-worker-runtime.ts

      - name: Retain release artifact for this exact commit
        uses: actions/upload-artifact@v4
        with:
          name: radar-release-${{ github.sha }}
          path: release/radar-release-${{ github.sha }}.tar.gz
          retention-days: 7
