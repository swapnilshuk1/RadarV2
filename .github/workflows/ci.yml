name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc -p tsconfig.verify.json --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Certification Test Manifest
        # The scraper preflight test launches a real offline Chromium instance.
        # Browser availability is a prerequisite, not a mocked success.
        run: |
          npx playwright install --with-deps chromium
          npx vitest run --config vitest.certification.config.ts

      - name: Package verified Linux server output
        run: tar -czf radar-linux-output.tar.gz .output

      - name: Retain release output for this exact commit
        uses: actions/upload-artifact@v4
        with:
          name: radar-linux-output-${{ github.sha }}
          path: radar-linux-output.tar.gz
          retention-days: 7
