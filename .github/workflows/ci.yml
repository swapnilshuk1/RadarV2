name: CI

on:
  push:
    branches: [main, "rebuild/**", "readiness/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked machine state and generated artifacts
        shell: bash
        run: |
          set -euo pipefail

          forbidden_dirs=(
            audit
            audit-reports
            forensics
            output
            playwright-profile
            radar-certification
            sample
            scraper-profile
          )

          failed=0
          for dir in "${forbidden_dirs[@]}"; do
            if git ls-files "${dir}/**" | grep -q .; then
              echo "::error::Tracked repository artifact directory: ${dir}/"
              failed=1
            fi
          done

          forbidden_files="$(
            git ls-files |
              grep -E '(^|/)(auth|auth-wal|auth-shm)$|\.(sqlite|sqlite-shm|sqlite-wal|db|db-wal|db-shm|mhtml|docx)$|(^|/).*_dump\..*$|(^|/).*api_hit.*\.json$|(^|/)(search_page_dump\.html|single_card\.html|next_data\.json)$|^(test\.js|test.*\.cjs|temp\.js|parser\.cjs|scripts-and-tests-inventory\.json|radar-challenge-corpus\.json)
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc -p tsconfig.verify.json --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Certification Test Manifest
        # The scraper preflight test launches a real offline Chromium instance.
        # Browser availability is a prerequisite, not a mocked success.
        run: |
          npx playwright install --with-deps chromium
          npx vitest run --config vitest.certification.config.ts

      - name: Package verified Linux server output
        run: tar -czf radar-linux-output.tar.gz .output

      - name: Retain release output for this exact commit
        uses: actions/upload-artifact@v4
        with:
          name: radar-linux-output-${{ github.sha }}
          path: radar-linux-output.tar.gz
          retention-days: 7
 ||
              true
          )"
          if [ -n "$forbidden_files" ]; then
            echo "::error::Forbidden tracked artifacts:"
            echo "$forbidden_files"
            failed=1
          fi

          exit "$failed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc -p tsconfig.verify.json --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Certification Test Manifest
        # The scraper preflight test launches a real offline Chromium instance.
        # Browser availability is a prerequisite, not a mocked success.
        run: |
          npx playwright install --with-deps chromium
          npx vitest run --config vitest.certification.config.ts

      - name: Package verified Linux server output
        run: tar -czf radar-linux-output.tar.gz .output

      - name: Retain release output for this exact commit
        uses: actions/upload-artifact@v4
        with:
          name: radar-linux-output-${{ github.sha }}
          path: radar-linux-output.tar.gz
          retention-days: 7
