name: Transition Control

on:
  # Historical gate evidence remains available for an explicit audit. Normal
  # rebuild/main changes use the current typecheck/build/certification CI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-control:
    name: Verify transition gate and batch scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Verify transition control
        run: node scripts/transition/verify-transition-control.mjs
