<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Extraction QA</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif; background: #0b0d10; color: #e6e6e6; }
  header { padding: 12px 20px; background: #14181d; border-bottom: 1px solid #222; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: #9cf; }
  .metric { font-variant-numeric: tabular-nums; }
  .metric strong { color: #fff; }
  main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 55px); }
  aside { border-right: 1px solid #222; overflow: auto; }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li { padding: 10px 14px; border-bottom: 1px solid #1a1e24; cursor: pointer; }
  aside li:hover { background: #14181d; }
  aside li.active { background: #1a2634; }
  aside .role { font-weight: 600; color: #fff; }
  aside .co { color: #8aa; font-size: 12px; }
  section.detail { padding: 20px; overflow: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6cf; margin: 0 0 8px; }
  pre.jd { background: #14181d; padding: 12px; border-radius: 6px; white-space: pre-wrap; max-height: 60vh; overflow: auto; border: 1px solid #222; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1a1e24; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; color: #789; }
  tr.fail { background: #2a1416; }
  tr.pass { background: transparent; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .b-ok { background: #1b4d2b; color: #a8e6b8; }
  .b-fail { background: #5b1b1e; color: #f2b0b3; }
  .b-warn { background: #4a3a12; color: #e6cf8b; }
  .quote { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #cfd; margin-top: 4px; }
  mark { background: #ffb300; color: #000; padding: 0 2px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>Extraction QA</h1>
  <span class="metric" id="m-overall">…</span>
  <span class="metric" id="m-core">…</span>
  <span class="metric" id="m-anchor">…</span>
  <span class="metric" id="m-meta"></span>
</header>
<main>
  <aside><ul id="case-list"></ul></aside>
  <section class="detail" id="detail"><em>Select a case →</em></section>
</main>
<script>
const pct = (n) => (n * 100).toFixed(1) + '%';
const esc = (s) => (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function highlight(text, quotes) {
  let out = esc(text);
  for (const q of quotes) {
    if (!q) continue;
    const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(e, 'g'), '<mark>' + esc(q) + '</mark>');
  }
  return out;
}

let report = null;
let candidateByCase = null;

async function load() {
  const r = await fetch('/api/report/latest');
  if (!r.ok) { document.body.innerHTML = '<p style="padding:20px">No report yet. Run: <code>npm run eval</code></p>'; return; }
  report = await r.json();
  document.getElementById('m-overall').innerHTML = `Overall F1 <strong>${pct(report.overall.f1)}</strong>`;
  document.getElementById('m-core').innerHTML = `Core F1 <strong>${pct(report.perTier.Core.f1)}</strong>`;
  document.getElementById('m-anchor').innerHTML = `Anchor violations <strong>${report.anchorViolations}</strong>`;
  document.getElementById('m-meta').textContent = `extractor ${report.extractorVersion} · mode ${report.mode}`;

  const list = document.getElementById('case-list');
  list.innerHTML = report.cases.map(c => {
    const failed = c.dimensions.filter(d => !d.correct).length;
    const badge = failed > 0 ? `<span class="badge b-fail">${failed}</span>` : '<span class="badge b-ok">✓</span>';
    return `<li data-id="${c.caseId}"><div class="role">${esc(c.role)} ${badge}</div><div class="co">${esc(c.company)}</div></li>`;
  }).join('');
  list.querySelectorAll('li').forEach(li => li.addEventListener('click', () => select(li.dataset.id)));
  if (report.cases[0]) select(report.cases[0].caseId);
}

async function select(id) {
  document.querySelectorAll('aside li').forEach(li => li.classList.toggle('active', li.dataset.id === id));
  const caseGrade = report.cases.find(c => c.caseId === id);
  const r = await fetch('/api/case/' + id);
  const data = await r.json();

  // Build candidate map from expected + snapshot re-run (approximate; server-side re-run would be ideal).
  const rows = caseGrade.dimensions.map(d => {
    const cls = d.correct ? 'pass' : 'fail';
    const g = data.expected.dimensions.find(x => x.key === d.key);
    const goldenQuotes = (g?.jdEvidence?.evidence || []).map(e => e.quote);
    return `<tr class="${cls}">
      <td>${d.key}<br><span class="badge ${d.importance === 'Core' ? 'b-warn' : ''}">${d.importance}</span></td>
      <td>${esc(g?.jdEvidence?.value || '—')}<br><span class="badge b-ok">${d.goldenStatus}</span>
        ${goldenQuotes.map(q => `<div class="quote">"${esc(q)}"</div>`).join('')}</td>
      <td>${esc(g && d.candidatePresent ? (d.valueMatch ? g.jdEvidence.value : '(mismatch)') : '—')}<br>
        <span class="badge ${d.candidatePresent ? 'b-ok' : 'b-fail'}">${d.candidateStatus}</span></td>
      <td>${d.correct ? '<span class="badge b-ok">correct</span>' :
        (d.candidatePresent ? '<span class="badge b-fail">wrong</span>' : '<span class="badge b-warn">missed</span>')}
        ${d.anchorsValid ? '' : '<div class="badge b-fail">anchor invalid</div>'}</td>
    </tr>`;
  }).join('');

  const allQuotes = data.expected.dimensions.flatMap(d => (d.jdEvidence.evidence || []).map(e => e.quote));
  document.getElementById('detail').innerHTML = `
    <h2>${esc(caseGrade.role)} — ${esc(caseGrade.company)}</h2>
    <div class="grid">
      <div>
        <h2>Job Description (evidence highlighted)</h2>
        <pre class="jd">${highlight(data.jd, allQuotes)}</pre>
      </div>
      <div>
        <h2>Dimensions (${caseGrade.dimensions.filter(d=>!d.correct).length} failing)</h2>
        <table><thead><tr><th>Dimension</th><th>Golden</th><th>Candidate</th><th>Verdict</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

load();
</script>
</body>
</html>
